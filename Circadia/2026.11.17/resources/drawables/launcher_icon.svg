<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Sun (left half): three concentric warm rings -->
  <circle cx="13" cy="20" r="9.5"  fill="#AA5500"/>
  <circle cx="13" cy="20" r="7.5"  fill="#FFAA00"/>
  <circle cx="13" cy="20" r="4.5"  fill="#FFFF00"/>

  <!-- Moon (right half): grey rim, silver body -->
  <circle cx="27"   cy="20"   r="7.5" fill="#555566"/>
  <circle cx="27"   cy="20"   r="6.0" fill="#C8CDD3"/>

  <!-- Lunar craters -->
  <circle cx="28.7" cy="18.3" r="0.9" fill="#80848B"/>
  <circle cx="25.5" cy="21.7" r="0.7" fill="#80848B"/>
  <circle cx="27.5" cy="22.0" r="0.5" fill="#90949A"/>
</svg>
